<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>

<style>
body{
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

.box{
    background:white;
    padding:30px;
    border:1px solid #ccc;
    width:300px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="box">
<h2>로그인</h2>

<input type="text" id="id" placeholder="아이디">
<input type="password" id="pw" placeholder="비밀번호">

<button onclick="login()">로그인</button>
</div>

<script>
function login(){
    if(
        document.getElementById("id").value==="admin"
        &&
        document.getElementById("pw").value==="1234"
    ){
        location.href="board.html";
    }else{
        alert("아이디 또는 비밀번호가 틀렸습니다.");
    }
}
</script>

</body>
</html>
